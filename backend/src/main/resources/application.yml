spring:
  application:
    name: perde
  datasource:
    # Varsayılan: kurulum gerektirmeyen bellek içi H2 (PostgreSQL kipi). Uygulama kapanınca veri silinir.
    # PostgreSQL için PERDE_DB_URL / PERDE_DB_USER / PERDE_DB_PASSWORD ortam değişkenlerini ver.
    url: ${PERDE_DB_URL:jdbc:h2:mem:perde;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${PERDE_DB_USER:sa}
    password: ${PERDE_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # şemayı Flyway kurar; Hibernate yalnızca uyumu denetler

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

perde:
  hold-seconds: 300
  max-seats: 6
  allowed-origins: ${PERDE_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  crowd:
    enabled: ${PERDE_CROWD:true}   # demo kalabalığı; gerçek kullanımda false yap
