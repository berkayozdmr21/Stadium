spring:
  application:
    name: stadyum
  datasource:
    # Varsayılan: kurulum gerektirmeyen bellek içi H2 (PostgreSQL kipi). Uygulama kapanınca veri silinir.
    # PostgreSQL için STADYUM_DB_URL / STADYUM_DB_USER / STADYUM_DB_PASSWORD ortam değişkenlerini ver.
    url: ${STADYUM_DB_URL:jdbc:h2:mem:stadyum;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
    username: ${STADYUM_DB_USER:sa}
    password: ${STADYUM_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # şemayı Flyway kurar; Hibernate yalnızca uyumu denetler

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health

stadyum:
  hold-seconds: 300
  max-seats: 6
  allowed-origins: ${STADYUM_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  crowd:
    enabled: ${STADYUM_CROWD:true}   # demo kalabalığı; gerçek kullanımda false yap
